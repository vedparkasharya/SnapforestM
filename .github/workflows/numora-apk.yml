name: Build Numora APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'numora-android/**'
      - '.github/workflows/numora-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: numora-android
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp numora-android/app/build/outputs/apk/debug/app-debug.apk Numora-v1.0.2.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Numora-Android-APK-v1.0.2
          path: Numora-v1.0.2.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish app update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Numora v1.0.2
          body: |
            Numora Android update.
            versionCode=3
            Includes WebView redirect/loading fixes and in-app update checking.
          files: Numora-v1.0.2.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
